<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="pwaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c2d12" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#pwaGrad)" />
  
  <!-- Food Icon Elements -->
  <g filter="url(#pwaShadow)">
    <!-- Chopsticks -->
    <path d="M 170 140 L 375 295" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <path d="M 195 115 L 395 305" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    
    <!-- Rising Steam Waves -->
    <path d="M 256 160 Q 240 190 256 220" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9" />
    <path d="M 205 170 Q 192 195 205 220" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75" />
    <path d="M 307 170 Q 320 195 307 220" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75" />

    <!-- Bowl Body -->
    <path d="M 120 260 C 120 380 200 420 256 420 C 312 420 392 380 392 260 Z" fill="#ffffff" />
    
    <!-- Bowl Rim -->
    <rect x="110" y="248" width="292" height="24" rx="12" fill="#ffffff" />
    
    <!-- Decorative Bowl Accent Strip -->
    <path d="M 140 286 C 180 316 332 316 372 286" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
    
    <!-- Bowl Base Foot -->
    <path d="M 196 414 L 186 438 L 326 438 L 316 414 Z" fill="#ffffff" />
    
    <!-- Sparkle Star -->
    <path d="M 390 140 Q 390 160 410 160 Q 390 160 390 180 Q 390 160 370 160 Q 390 160 390 140 Z" fill="#fef08a" />
  </g>
</svg>
