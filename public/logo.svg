<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 15 450 505" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Gold/Copper Radial & Linear Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2610A" />
      <stop offset="18%" stop-color="#E88A1A" />
      <stop offset="42%" stop-color="#FBBF24" />
      <stop offset="58%" stop-color="#F59E0B" />
      <stop offset="78%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#9A4305" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#9A3412" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFBEB" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="plateShine" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>

    <filter id="logoDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350F" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#451A03" flood-opacity="0.35" />
    </filter>

    <filter id="innerBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#451A03" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#logoDepth)">
    <!-- 1. Outer Question Mark Spiral Track -->
    <!-- Outer thick circular ribbon curving into a question mark swirl -->
    <path 
      d="M 215 425
         C 145 405 85 345 65 265
         C 40 160 120 65 225 45
         C 335 25 435 105 455 210
         C 475 320 395 425 285 425
         L 285 395
         C 375 395 440 305 425 215
         C 410 125 325 55 235 72
         C 145 88 80 170 100 258
         C 118 322 165 372 225 392
         Z" 
      fill="url(#goldLinear)" 
    />
    
    <!-- Outer Ring Specular Stroke -->
    <path 
      d="M 215 425
         C 145 405 85 345 65 265
         C 40 160 120 65 225 45
         C 335 25 435 105 455 210
         C 475 320 395 425 285 425" 
      stroke="url(#goldSheen)" 
      stroke-width="3" 
      fill="none" 
      stroke-linecap="round"
    />

    <!-- 2. Mid Ring Swirl Arc connecting to Question mark body -->
    <path 
      d="M 225 392
         C 165 370 125 315 125 250
         C 125 175 180 115 255 115
         C 330 115 385 175 385 250
         C 385 305 350 350 305 375
         C 285 386 270 405 270 425
         L 230 425
         C 230 395 250 375 270 360
         C 305 335 340 300 340 250
         C 340 198 300 155 255 155
         C 205 155 165 198 165 250
         C 165 295 195 340 235 360
         Z" 
      fill="url(#goldLinear)"
    />

    <!-- 3. Central Dining Plate with Rich Warm Gradient -->
    <circle cx="250" cy="245" r="105" fill="url(#plateShine)" />
    <!-- Plate Inner Rim Ring -->
    <circle cx="250" cy="245" r="94" fill="none" stroke="#B45309" stroke-width="3" opacity="0.6" />
    <circle cx="250" cy="245" r="92" fill="none" stroke="#FEF08A" stroke-width="2" opacity="0.5" />

    <!-- 4. Cutlery: Spoon (Left) and Fork (Right) angled at ~45 degrees -->
    <g transform="rotate(40, 250, 245)" filter="url(#innerBevel)">
      
      <!-- SPOON -->
      <g transform="translate(-22, 0)">
        <!-- Spoon Bowl (Solid with rim) -->
        <ellipse cx="250" cy="180" rx="19" ry="29" fill="#FFFBEB" />
        <ellipse cx="250" cy="180" rx="14" ry="23" fill="url(#goldLinear)" />
        <ellipse cx="248" cy="178" rx="10" ry="18" fill="#FDE68A" opacity="0.6" />
        
        <!-- Spoon Neck & Handle -->
        <path 
          d="M 246 208 
             C 246 220 244 245 243 275
             C 242 295 241 305 241 312
             C 241 318 245 322 250 322
             C 255 322 259 318 259 312
             C 259 305 258 295 257 275
             C 256 245 254 220 254 208
             Z" 
          fill="#FFFBEB" 
        />
        <path 
          d="M 248 215 
             L 246 295
             C 246 305 248 312 250 312
             C 252 312 254 305 254 295
             L 252 215
             Z" 
          fill="url(#goldLinear)" 
        />
      </g>

      <!-- FORK -->
      <g transform="translate(22, 0)">
        <!-- Fork Tines Base and 4 Tines -->
        <path 
          d="M 234 162
             L 234 192
             C 234 205 240 214 246 216
             L 246 312
             C 246 318 250 322 255 322
             C 260 322 264 318 264 312
             L 264 216
             C 270 214 276 205 276 192
             L 276 162
             L 270 162
             L 270 188
             C 270 194 267 197 264 197
             L 264 162
             L 258 162
             L 258 188
             C 258 194 256 197 255 197
             C 254 197 252 194 252 188
             L 252 162
             L 246 162
             L 246 197
             C 243 197 240 194 240 188
             L 240 162
             Z" 
          fill="#FFFBEB" 
        />
        <!-- Inner gold fill for fork handle and spine -->
        <path 
          d="M 251 222
             L 251 305
             C 251 310 253 313 255 313
             C 257 313 259 310 259 305
             L 259 222
             Z" 
          fill="url(#goldLinear)" 
        />
      </g>
    </g>

    <!-- 5. Question Mark Bottom Dot -->
    <circle cx="250" cy="480" r="30" fill="url(#goldLinear)" />
    <circle cx="245" cy="474" r="24" fill="url(#goldSheen)" opacity="0.4" />
    <circle cx="250" cy="480" r="29" fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.7" />

  </g>
</svg>
